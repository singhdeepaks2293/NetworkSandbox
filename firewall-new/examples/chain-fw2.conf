# fw2: server side. Accepts the flow from fw1 without address translation.
system hostname fw2
system logging on
interface eth1 zone transit address 10.0.0.2/24
interface eth2 zone lan2 address 192.168.2.1/24
policy 10 transit lan2 any any icmp any permit
policy 11 transit lan2 any any tcp 9000 permit
policy 12 transit lan2 any any tcp 8080 permit url strict
policy 20 lan2 transit any any icmp any permit nat
policy 21 lan2 transit any any tcp 9000 permit nat
policy 22 lan2 transit any any tcp 8080 permit

url-filter strict block evil.test

# Port-forward the firewall's own LAN address to the HTTP server on pc2.
dnat 1 tcp any 8080 192.168.2.10 8080

route default eth1 via 10.0.0.1
