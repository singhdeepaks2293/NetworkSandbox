# Two independent virtual firewalls on one device.
# System, address/service/security-profile objects are shared.
system hostname edge-vdoms
system gui-port 8080
system cli-port 2200
system log-format text

address corp-dns 192.168.10.53
service dns udp 53
url-filter corp block gambling malware
url-filter corp allow intranet.test
ips-profile edge
ips-signature edge 1 /etc/passwd
av-profile av1
av-signature av1 1 EICAR

vdom root
interface port1 zone wan address 203.0.113.2/24 mac 02:00:00:00:00:01
interface port2 zone mgmt address 10.0.0.1/24 mac 02:00:00:00:00:02
route default port1 via 203.0.113.1
policy 10 mgmt wan any any tcp 22 deny log

vdom tenant-a
interface pa1 zone untrust address 198.51.100.2/24 mac 02:00:00:00:00:11
interface pa2 zone trust address 192.168.10.1/24 mac 02:00:00:00:00:12
route default pa1 via 198.51.100.1
dnat 100 tcp 198.51.100.2 8080 192.168.10.20 80
policy 110 trust untrust any any any any permit nat log
policy 120 trust untrust any @corp-dns udp @dns permit log
policy 130 trust untrust any any tcp 443 permit url corp ips edge av av1 log

vdom tenant-b
interface pb1 zone untrust address 198.51.101.2/24 mac 02:00:00:00:00:21
interface pb2 zone trust address 192.168.20.1/24 mac 02:00:00:00:00:22
route default pb1 via 198.51.101.1
policy 210 trust untrust any any any any permit nat log
policy 220 trust untrust any any tcp 443 permit url corp log
