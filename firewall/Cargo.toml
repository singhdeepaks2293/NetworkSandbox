[package]
name = "firewall"
version = "0.1.0"
edition = "2021"
description = "A tiny educational stateful IPv4 firewall with a vendor-neutral CLI and a built-in web GUI"
license = "MIT"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
libc = "0.2"
netlink-packet-core = "0.9"
netlink-packet-netfilter = "0.4"
netlink-sys = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "firewall"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
