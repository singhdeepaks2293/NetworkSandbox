# Example next-generation policy set. It demonstrates address objects and
# groups, custom services and applications, URL filtering, IPS/AV signature
# profiles, destination NAT, shaping and zone flood protection.

system hostname ngfw
system logging on
system log-format json

zone untrust syn-flood 400
zone untrust icmp-flood 200

interface port1 zone untrust address 203.0.113.2/24
interface port2 zone trust address 192.168.10.1/24
interface port3 zone dmz address 192.168.20.1/24

route default port1 via 203.0.113.1

address web-servers 192.168.20.20 192.168.20.21
address admin-host 192.168.10.50
address-group servers web-servers
address-group admins admin-host

service web tcp 8080
service admin tcp 8443
app-def internal-web tcp 8080
app-def admin-ui tcp 8443

url-filter corp block gambling malware phishing
url-filter corp allow corp.example
ips-profile edge
ips-signature edge 1 \x2fetc\x2fpasswd
av-profile av
av-signature av 1 EICAR

shaper branch 2000

# Public 8080 is forwarded to the first web server in the DMZ.
dnat 10 tcp any 8080 192.168.20.20 80

# Outbound: servers may use the internal web app through the corp filter.
policy 10 trust untrust @servers any tcp @web permit app internal-web url corp ips edge av av shaper branch log
# Inbound: DNAT'd web traffic and direct requests to the web service.
policy 20 untrust dmz any @servers tcp 80 permit log
# Administrators may reach the admin UI.
policy 30 trust dmz @admins any tcp @admin permit app admin-ui log
# General outbound access.
policy 40 trust untrust any any any any permit nat log
# Outbound from the DMZ.
policy 50 dmz untrust any any any any permit nat log
# Default deny.
policy 100 any any any any any any deny log
