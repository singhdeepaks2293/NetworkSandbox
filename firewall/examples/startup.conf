# firewall startup configuration used by the containerlab example
system hostname fw1
system cli-port 2200
system gui-port 8080
system conntrack-tcp 300
system conntrack-udp 30
system conntrack-icmp 10
system logging on

interface eth1 zone wan address 10.0.0.1/24
interface eth2 zone lan address 192.168.10.1/24

route default eth1 via 10.0.0.254

# LAN may reach the WAN; outbound flows are source-NATed to 10.0.0.1.
policy 10 lan wan any any any any permit nat
# Replies and new inbound flows from the WAN are allowed here. Tighten this
# in real life, for example: policy 20 wan lan any 192.168.10.10 tcp 22 permit
policy 20 wan lan any any any any permit
