# fw1: client side. Source-NATs LAN traffic onto the transit link.
system hostname fw1
system logging on
interface eth1 zone lan1 address 192.168.1.1/24
interface eth2 zone transit address 10.0.0.1/24
policy 10 lan1 transit any any icmp any permit nat
policy 11 lan1 transit any any tcp 9000 permit nat
policy 12 lan1 transit any any tcp 8080 permit nat
policy 20 transit lan1 any any icmp any permit
policy 21 transit lan1 any any tcp 9000 permit
policy 22 transit lan1 any any tcp 8080 permit

route default eth2 via 10.0.0.2
