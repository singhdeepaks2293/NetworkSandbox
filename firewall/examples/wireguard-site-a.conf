# Site-to-site WireGuard, site A. The tunnel is an interface in zone "vpn",
# so ordinary policies decide what crosses it. Keys come from
#   firewall wg-genkey > a.key ; firewall wg-pubkey < a.key
# (example keys below; generate your own). The peer's public key is site B's.
system hostname site-a
system logging on
interface eth1 zone trust address 10.1.0.1/24
interface eth2 zone untrust address 203.0.113.1/24
route default eth2 via 203.0.113.254

vpn wireguard wg0 private-key rT4zP84D4PYjk2Vv69DOSulYiR1CtoPPb+2imYXR8jE= listen-port 51820 address 10.99.0.1/24 zone vpn
vpn wireguard-peer wg0 site-b public-key ZGWbNIrQuXXZw+ET6LxLZx7c0Z4df7d+A4Ik5KJR2nc= allowed-ips 10.99.0.2/32,10.2.0.0/24 endpoint 203.0.113.2:51820 keepalive 25

policy 10 trust vpn any any any any permit name to-site-b
policy 20 vpn trust any any tcp 22 permit name ssh-from-site-b
policy 30 trust untrust any any any any permit nat name internet
