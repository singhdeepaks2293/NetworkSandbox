# HA pair, unit a. Both units share interfaces, addresses and policy; the
# active one forwards and the passive one stays silent. eth9 is the dedicated
# HA link, owned by the OS (not listed as a dataplane interface).
system hostname fw-a
system logging on
ha mode active-passive
ha group 1
ha priority 200
ha bind 192.0.2.1:7600
ha peer 192.0.2.2:7600
ha secret change-me-to-a-long-random-secret
ha preempt off
ha hello 200
ha dead 1000

interface eth1 zone trust address 10.0.0.1/24
interface eth2 zone untrust address 203.0.113.2/24
route default eth2 via 203.0.113.1
policy 10 trust untrust any any any any permit nat name outbound
