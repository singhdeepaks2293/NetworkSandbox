name: firewall-lab

# fw has two routed interfaces, one per zone. The two alpine nodes are plain
# hosts; each uses the firewall as its default gateway.
#
#   pc-wan:eth1 --- 10.0.0.0/24 --- eth1:fw:eth2 --- 192.168.10.0/24 --- eth1:pc-lan
#
# Deploy:
#   make image
#   containerlab deploy -t firewall.clab.yml
#   docker cp clab-firewall-lab-fw:/etc/firewall/firewall.bootstrap-password /tmp/fw-pw
#   docker exec -e VELA_CLI_USERNAME=admin -e VELA_CLI_PASSWORD="$(cat /tmp/fw-pw)" \
#     clab-firewall-lab-fw /firewall cli -c "show policies"
#   docker exec -it clab-firewall-lab-pc-lan ping -c 3 10.0.0.99
#   curl -k https://$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' clab-firewall-lab-fw):8080/api/v1/state
#
# The web GUI requires login and serves a self-signed TLS certificate by
# default; it binds 0.0.0.0:8080 inside the container.

topology:
  nodes:
    fw:
      kind: linux
      image: firewall:latest
      cmd: daemon --config /etc/firewall/firewall.conf --hostname fw1
      binds:
        - examples/startup.conf:/etc/firewall/firewall.conf:ro
      sysctls:
        net.ipv4.ip_forward: 0
        net.ipv6.conf.all.forwarding: 0
    pc-wan:
      kind: linux
      image: alpine:3.19
      exec:
        - ip addr add 10.0.0.99/24 dev eth1
        - ip route replace default via 10.0.0.1
        - ip link set eth1 up
      cmd: sleep infinity
    pc-lan:
      kind: linux
      image: alpine:3.19
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1
        - ip link set eth1 up
      cmd: sleep infinity

  links:
    - endpoints: ["fw:eth1", "pc-wan:eth1"]
    - endpoints: ["fw:eth2", "pc-lan:eth1"]
