# NGFW example: App-ID, list policies, groups, profile groups, static routes,
# and a separate source-NAT rulebase. The same config can be edited with
# `cli-style fortios` or `cli-style panos` from the CLI.
system hostname edge-ngfw
system logging on
system log-format json

interface port1 zone untrust address 203.0.113.2/24
interface port2 zone trust address 10.0.0.1/24
interface port3 zone dmz address 10.1.0.1/24

route default port1 via 203.0.113.1
route 172.16.0.0/12 port3 via 10.1.0.254 name lab-networks

address web-servers 10.1.0.10 10.1.0.11
address quarantine 10.0.0.66
service web tcp 80,443
service dns-any any 53
service-group basics web dns-any
app-group social facebook instagram tiktok category:social-networking
app-group work-saas ms-office365 ms-teams slack github anthropic-claude

url-filter corp block category:gambling category:malware category:phishing evil.test
ips-profile edge
ips-signature edge 1 /etc/passwd
av-profile av
av-signature av 1 EICAR-STANDARD-ANTIVIRUS-TEST-FILE
profile-group default url corp ips edge av av

user-group netops alice bob
user-map 10.0.0.200 build-server

# Quarantined host: nothing.
policy 5 trust any @quarantine any any any deny name quarantine
# Social media is identified by App-ID and blocked whatever port it uses.
policy 10 trust untrust any any tcp application-default deny app social name block-social
# Work SaaS and plain web, on their standard ports only, inspected.
policy 20 trust untrust any any tcp application-default permit app work-saas,ssl,web-browsing,quic group default name web-out
# DNS and NTP for everyone except quarantine.
policy 30 trust untrust !@quarantine any any application-default permit app dns,ntp name infra
# SSH out only for netops users (logins pushed with `user-id login`).
policy 35 trust untrust any any tcp application-default permit app ssh user netops name netops-ssh
# Public web servers in the DMZ.
policy 40 untrust dmz any @web-servers any @web permit group default name publish-web

# Hosts in the same zone may talk to each other, as on PAN-OS.
default-rule intrazone allow

# Outbound source NAT is a rulebase of its own.
snat 10 trust untrust 10.0.0.0/24 any masquerade name lan-out
dnat 1 tcp 203.0.113.2/32 443 10.1.0.10 443 name web-vip
