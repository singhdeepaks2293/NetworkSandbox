# Dual-stack (IPv4 + IPv6). The same zones and policies cover both families:
# an address list decides which family a rule matches; "any" matches both.
system hostname dual-stack
system logging on

interface eth1 zone trust address 10.0.0.1/24 address6 2001:db8:1::1/64
interface eth2 zone untrust address 203.0.113.2/24 address6 2001:db8:ffff::2/64
route default eth2 via 203.0.113.1
route6 default eth2 via 2001:db8:ffff::1

address web-servers 10.1.0.10 2001:db8:10::10
app-group social facebook instagram category:social-networking

policy 10 trust untrust any any tcp application-default deny app social name block-social
policy 20 trust untrust any any any application-default permit app ssl,web-browsing,dns,quic name web-out
policy 30 untrust trust any @web-servers tcp 443 permit name publish-web
# IPv4 needs NAT to reach the internet; IPv6 is routed as is.
snat 10 trust untrust 10.0.0.0/24 any masquerade
