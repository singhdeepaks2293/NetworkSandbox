interface port1 zone untrust address 203.0.113.2/24
interface port2 zone trust address 10.0.0.1/24 address6 2001:db8:1::1/64
route default port1 via 203.0.113.1
route 172.16.0.0/12 port2 via 10.0.0.254 distance 20 name lab
route6 default port1 via 2001:db8:ffff::1
address quarantine 10.0.0.66
address web 10.1.0.10 2001:db8:10::10
address-group servers web quarantine
service web tcp 80,443,8000-8080
service-group basics web
app-def admin-ui tcp 8443
app-group social facebook instagram category:social-networking
user-group admins alice bob
user-map 10.0.5.0/24 kiosk
url-filter corp block bad.example worse.example
url-filter corp allow good.example
ips-profile edge
ips-signature edge 1 /etc/passwd
av-profile av
av-signature av 1 EICAR
shaper slow 512
profile-group default url corp ips edge av av
policy 10 trust untrust any any tcp application-default deny app social
policy 20 trust untrust !@quarantine any any @basics permit group default name out nat
policy 30 trust untrust any any udp 53 permit nolog disable user admins shaper slow
snat 10 trust untrust 10.0.0.0/24 any masquerade name lan-out
dnat 1 tcp 203.0.113.2/32 443 10.1.0.10 443 name web-vip
default-rule intrazone allow log
default-rule interzone deny
zone untrust syn-flood 100
zone untrust udp-flood 500
